                  #     }
                  
              except json.JSONDecodeError as e:
                  logger.error(f"JSON decode error: {str(e)}")
                  return {
                      'statusCode': 400,
                      'body': json.dumps({'error': 'Invalid JSON in message body'})
                  }
              except Exception as e:
                  logger.error(f"Unexpected error: {str(e)}", exc_info=True)
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': 'Internal server error'})
                  }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: dev1

  # ============================================================================
  # Event Source Mapping (SQS to Lambda)
  # ============================================================================
  SQSEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt LambdaAgentsSQSQueue.Arn
      FunctionName: !Ref LambdaAgentsFunction
      Enabled: true
      BatchSize: 1
      MaximumBatchingWindowInSeconds: 0
      FunctionResponseTypes:
        - ReportBatchItemFailures

  # ============================================================================
  # API Gateway REST API (Phase 1.1)
  # ============================================================================
  LambdaAgentsAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-api'
      Description: API Gateway for Lambda Agents
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: dev1

  # ============================================================================
  # API Gateway Resource (/v1)
  # ============================================================================
  V1Resource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref LambdaAgentsAPI
      ParentId: !GetAtt LambdaAgentsAPI.RootResourceId
      PathPart: v1

  # ============================================================================
  # API Gateway Resource (/v1/agents)
  # ============================================================================
  AgentsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref LambdaAgentsAPI
      ParentId: !Ref V1Resource
      PathPart: agents

  # ============================================================================
  # API Gateway Method (POST /v1/agents)
  # ============================================================================
  AgentsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LambdaAgentsAPI
      ResourceId: !Ref AgentsResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaAgentsFunction.Arn}/invocations'

  # ============================================================================
  # Lambda Permission for API Gateway
  # ============================================================================
  ApiGatewayInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaAgentsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LambdaAgentsAPI}/*/*'

  # ============================================================================
  # API Gateway CloudWatch Logs Role
  # ============================================================================
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-apigw-logs-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiGatewayCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: dev1

  # ============================================================================
  # API Gateway Account (CloudWatch Logs Role)
  # ============================================================================
  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  # ============================================================================
  # API Gateway Deployment
  # ============================================================================
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - AgentsMethod
    Properties:
      RestApiId: !Ref LambdaAgentsAPI
      Description: !Sub 'Deployment for ${Environment}'

  # ============================================================================
  # API Gateway Stage
  # ============================================================================
  ApiStage:
    Type: AWS::ApiGateway::Stage
    DependsOn:
      - ApiGatewayAccount
    Properties:
      RestApiId: !Ref LambdaAgentsAPI
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref Environment
      Description: !Sub 'Stage for ${Environment} environment'
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: dev1

Outputs:
  QueueURL:
    Description: SQS Queue URL for sending messages
    Value: !Ref LambdaAgentsSQSQueue
    Export:
      Name: !Sub '${ProjectName}-${Environment}-QueueURL'

  QueueArn:
    Description: SQS Queue ARN
    Value: !GetAtt LambdaAgentsSQSQueue.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-QueueArn'

  BucketName:
    Description: S3 Bucket name for Bedrock results
    Value: !Ref LambdaAgentsResultsBucket
    Export:
      Name: !Sub '${ProjectName}-${Environment}-BucketName'

  LambdaFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt LambdaAgentsFunction.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-FunctionArn'

  LambdaFunctionName:
    Description: Lambda Function Name
    Value: !Ref LambdaAgentsFunction
    Export:
      Name: !Sub '${ProjectName}-${Environment}-FunctionName'

  RoleArn:
    Description: IAM Role ARN for Lambda Execution
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-RoleArn'

  LogGroupName:
    Description: CloudWatch Log Group Name
    Value: !Ref LambdaLogGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-LogGroup'

  ApiEndpoint:
    Description: API Gateway endpoint URL for /v1/agents
    Value: !Sub 'https://${LambdaAgentsAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/v1/agents'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ApiEndpoint'

  ApiId:
    Description: API Gateway REST API ID
    Value: !Ref LambdaAgentsAPI
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ApiId'
