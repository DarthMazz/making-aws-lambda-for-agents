                  # )
                  # s3_client = boto3.client('s3', region_name='ap-northeast-1')
                  # 
                  # # Extract parameters from message
                  # request_id = message_body.get('request_id')
                  # prompt = message_body.get('prompt')
                  # model_id = message_body.get('model_id', 'anthropic.claude-3-sonnet-20240229-v1:0')
                  # 
                  # logger.info(f"Calling Bedrock with model: {model_id}")
                  # 
                  # # Call Bedrock API
                  # try:
                  #     response = bedrock_client.invoke_model(
                  #         modelId=model_id,
                  #         body=json.dumps({
                  #             'prompt': prompt,
                  #             'max_tokens_to_sample': 1024,
                  #             'temperature': 0.7
                  #         })
                  #     )
                  #     
                  #     # Parse Bedrock response
                  #     response_body = json.loads(response['body'].read())
                  #     bedrock_result = response_body.get('completion', '')
                  #     
                  #     logger.info(f"Bedrock response received: {bedrock_result[:100]}...")
                  #     
                  #     # Prepare result for S3
                  #     result = {
                  #         'request_id': request_id,
                  #         'prompt': prompt,
                  #         'model_id': model_id,
                  #         'bedrock_response': bedrock_result,
                  #         'timestamp': datetime.utcnow().isoformat(),
                  #         'status': 'success'
                  #     }
                  #     
                  #     # Upload to S3
                  #     s3_key = f"results/{request_id}/{datetime.utcnow().strftime('%Y%m%d_%H%M%S')}.json"
                  #     s3_client.put_object(
                  #         Bucket=os.environ.get('S3_BUCKET_NAME'),
                  #         Key=s3_key,
                  #         Body=json.dumps(result, indent=2),
