AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Lambda + SQS + Bedrock + S3 Integration Template'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

  ProjectName:
    Type: String
    Default: lambda-agents
    Description: Project name prefix for all resources

  LambdaMemory:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 3008
    Description: Lambda function memory in MB

  LambdaTimeout:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 900
    Description: Lambda function timeout in seconds

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
    Description: CloudWatch Logs retention period in days

  BedrockRegion:
    Type: String
    Default: ap-northeast-1
    Description: AWS region for Bedrock API calls

Resources:
  # ============================================================================
  # SQS Queue
  # ============================================================================
  LambdaAgentsSQSQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${Environment}-queue'
      VisibilityTimeout: !Ref LambdaTimeout
      MessageRetentionPeriod: 345600  # 4 days in seconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt LambdaAgentsDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: dev1

  # Dead Letter Queue (kept for future use, not actively used in Phase 1)
  LambdaAgentsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${Environment}-dlq'
      MessageRetentionPeriod: 1209600  # 14 days in seconds
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: dev1

  # ============================================================================
  # S3 Bucket for Bedrock Results
  # ============================================================================
  LambdaAgentsResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-results-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Suspended
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: dev1
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================================
  # IAM Role for Lambda Execution
  # ============================================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SQSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt LambdaAgentsSQSQueue.Arn
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt LambdaAgentsResultsBucket.Arn
                  - !Sub '${LambdaAgentsResultsBucket.Arn}/*'
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub 'arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:foundation-model/*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: dev1

  # ============================================================================
  # CloudWatch Log Group
  # ============================================================================
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-function'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: dev1
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-function'
      RetentionInDays: !Ref LogRetentionDays

  # ============================================================================
  # Lambda Function
  # ============================================================================
  LambdaAgentsFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-function'
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: !Ref LambdaMemory
      Timeout: !Ref LambdaTimeout
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref LambdaAgentsSQSQueue
          S3_BUCKET_NAME: !Ref LambdaAgentsResultsBucket
          BEDROCK_REGION: !Ref BedrockRegion
          LOG_LEVEL: INFO
      Code:
        ZipFile: |
