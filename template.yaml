AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Lambda + SQS + Bedrock + S3 Integration Template'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

  ProjectName:
    Type: String
    Default: lambda-agents
    Description: Project name prefix for all resources

  LambdaMemory:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 3008
    Description: Lambda function memory in MB

  LambdaTimeout:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 900
    Description: Lambda function timeout in seconds

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
    Description: CloudWatch Logs retention period in days

  BedrockRegion:
    Type: String
    Default: ap-northeast-1
    Description: AWS region for Bedrock API calls

Resources:
  # ============================================================================
  # SQS Queue
  # ============================================================================
  LambdaAgentsSQSQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${Environment}-queue'
      VisibilityTimeout: !Ref LambdaTimeout
      MessageRetentionPeriod: 345600  # 4 days in seconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt LambdaAgentsDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: dev1

  # Dead Letter Queue (kept for future use, not actively used in Phase 1)
  LambdaAgentsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${Environment}-dlq'
      MessageRetentionPeriod: 1209600  # 14 days in seconds
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: dev1

  # ============================================================================
  # S3 Bucket for Bedrock Results
  # ============================================================================
  LambdaAgentsResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-results-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Suspended
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: dev1
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================================
  # IAM Role for Lambda Execution
  # ============================================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SQSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt LambdaAgentsSQSQueue.Arn
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt LambdaAgentsResultsBucket.Arn
                  - !Sub '${LambdaAgentsResultsBucket.Arn}/*'
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub 'arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:foundation-model/*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: dev1

  # ============================================================================
  # CloudWatch Log Group
  # ============================================================================
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-function'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: dev1

  # ============================================================================
  # Lambda Function
  # ============================================================================
  LambdaAgentsFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-function'
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: !Ref LambdaMemory
      Timeout: !Ref LambdaTimeout
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref LambdaAgentsSQSQueue
          S3_BUCKET_NAME: !Ref LambdaAgentsResultsBucket
          BEDROCK_REGION: !Ref BedrockRegion
          LOG_LEVEL: INFO
      Code:
        ZipFile: |
          import json
          import os
          import logging
          from datetime import datetime

          logger = logging.getLogger()
          logger.setLevel(os.environ.get('LOG_LEVEL', 'INFO'))

          def _is_sqs_event(event):
              """Check if the event is from SQS"""
              return 'Records' in event and len(event['Records']) > 0 and 'eventSource' in event['Records'][0] and event['Records'][0]['eventSource'] == 'aws:sqs'

          def _is_api_gateway_event(event):
              """Check if the event is from API Gateway"""
              return 'requestContext' in event and 'resource' in event

          def _handle_api_gateway_request(event):
              """
              Handle API Gateway request
              
              Args:
                  event: API Gateway event
                  
              Returns:
                  dict: API Gateway Lambda proxy response
              """
              logger.info(f"Processing API Gateway request")
              
              # Parse request body
              try:
                  body = json.loads(event['body']) if isinstance(event['body'], str) else event['body']
              except (json.JSONDecodeError, TypeError) as e:
                  logger.error(f"Failed to parse request body: {str(e)}")
                  return {
                      'statusCode': 400,
                      'body': json.dumps({'error': 'Invalid JSON in request body'})
                  }
              
              # Validate required fields
              if not body.get('request_id') or not body.get('prompt'):
                  logger.warning("Missing required fields: request_id or prompt")
                  return {
                      'statusCode': 400,
                      'body': json.dumps({'error': 'Missing required fields: request_id, prompt'})
                  }
              
              logger.info(f"Message content: {json.dumps(body, indent=2)}")
              
              return {
                  'statusCode': 200,
                  'body': json.dumps({
                      'message': 'Message processed successfully via API Gateway',
                      'request_id': body.get('request_id'),
                      'timestamp': datetime.utcnow().isoformat()
                  })
              }

          def _handle_sqs_message(event):
              """
              Handle SQS message
              
              Args:
                  event: SQS event
                  
              Returns:
                  dict: Status response
              """
              logger.info(f"Processing SQS message")
              
              # Extract SQS records
              records = event.get('Records', [])
              
              if not records:
                  logger.warning("No SQS records found in event")
                  return {
                      'statusCode': 400,
                      'body': json.dumps({'message': 'No SQS records found'})
                  }
              
              # Process first record (batch size = 1)
              record = records[0]
              message_body = json.loads(record['body'])
              
              logger.info(f"Processing message: {json.dumps(message_body)}")
              logger.info(f"Message content: {json.dumps(message_body, indent=2)}")
              
              return {
                  'statusCode': 200,
                  'body': json.dumps({
                      'message': 'Message processed successfully via SQS',
                      'request_id': message_body.get('request_id'),
                      'timestamp': datetime.utcnow().isoformat()
                  })
              }

          def lambda_handler(event, context):
              """
              Phase 1 & 1.1: Handle both SQS and API Gateway requests
              
              Args:
                  event: Event from SQS or API Gateway
                  context: Lambda context
                  
              Returns:
                  dict: Status response
              """
              try:
                  logger.info(f"Received event: {json.dumps(event)}")
                  
                  # Determine event source and handle accordingly
                  if _is_api_gateway_event(event):
                      return _handle_api_gateway_request(event)
                  elif _is_sqs_event(event):
                      return _handle_sqs_message(event)
                  else:
                      logger.error("Unknown event type")
                      return {
                          'statusCode': 400,
                          'body': json.dumps({'error': 'Unknown event type'})
                      }
                  
                  # ========================================================================
                  # Phase 2: Bedrock Integration (Commented for future implementation)
                  # ========================================================================
                  # import boto3
