                  #     }
                  
              except json.JSONDecodeError as e:
                  logger.error(f"JSON decode error: {str(e)}")
                  return {
                      'statusCode': 400,
                      'body': json.dumps({'error': 'Invalid JSON in message body'})
                  }
              except Exception as e:
                  logger.error(f"Unexpected error: {str(e)}", exc_info=True)
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': 'Internal server error'})
                  }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: dev1

  # ============================================================================
  # Event Source Mapping (SQS to Lambda)
  # ============================================================================
  SQSEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt LambdaAgentsSQSQueue.Arn
      FunctionName: !Ref LambdaAgentsFunction
      Enabled: true
      BatchSize: 1
      MaximumBatchingWindowInSeconds: 0
      FunctionResponseTypes:
        - ReportBatchItemFailures

Outputs:
  QueueURL:
    Description: SQS Queue URL for sending messages
    Value: !Ref LambdaAgentsSQSQueue
    Export:
      Name: !Sub '${ProjectName}-${Environment}-QueueURL'

  QueueArn:
    Description: SQS Queue ARN
    Value: !GetAtt LambdaAgentsSQSQueue.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-QueueArn'

  BucketName:
    Description: S3 Bucket name for Bedrock results
    Value: !Ref LambdaAgentsResultsBucket
    Export:
      Name: !Sub '${ProjectName}-${Environment}-BucketName'

  LambdaFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt LambdaAgentsFunction.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-FunctionArn'

  LambdaFunctionName:
    Description: Lambda Function Name
    Value: !Ref LambdaAgentsFunction
    Export:
      Name: !Sub '${ProjectName}-${Environment}-FunctionName'

  RoleArn:
    Description: IAM Role ARN for Lambda Execution
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-RoleArn'

  LogGroupName:
    Description: CloudWatch Log Group Name
    Value: !Ref LambdaLogGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-LogGroup'
