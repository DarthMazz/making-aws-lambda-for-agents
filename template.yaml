                  #     )
                  #     
                  #     logger.info(f"Result uploaded to S3: s3://{os.environ.get('S3_BUCKET_NAME')}/{s3_key}")
                  #     
                  #     # Generate Presigned URL for S3 object (valid for 24 hours)
                  #     presigned_url = s3_client.generate_presigned_url(
                  #         'get_object',
                  #         Params={
                  #             'Bucket': os.environ.get('S3_BUCKET_NAME'),
                  #             'Key': s3_key
                  #         },
                  #         ExpiresIn=86400  # 24 hours in seconds
                  #     )
                  #     
                  #     logger.info(f"Presigned URL generated: {presigned_url[:80]}...")
                  #     
                  #     return {
                  #         'statusCode': 200,
                  #         'body': json.dumps({
                  #             'message': 'Message processed and result saved to S3',
                  #             'request_id': request_id,
                  #             's3_location': f"s3://{os.environ.get('S3_BUCKET_NAME')}/{s3_key}",
